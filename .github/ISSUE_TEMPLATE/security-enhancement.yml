name: 🛡️ Security Enhancement Request
description: Suggest security improvements or enhancements
title: "[SECURITY ENHANCEMENT] "
labels: ["security", "enhancement", "improvement"]
assignees:
  - security-team
body:
  - type: markdown
    attributes:
      value: |
        # 🛡️ Security Enhancement Request
        
        Help us improve our security posture by suggesting enhancements, new security measures, or improvements to existing security practices.

  - type: dropdown
    id: enhancement-type
    attributes:
      label: 🔧 Enhancement Type
      description: What type of security enhancement is this?
      options:
        - Authentication/Authorization improvement
        - Code scanning/analysis enhancement
        - Dependency security improvement
        - Infrastructure security enhancement
        - Security policy/procedure improvement
        - Security monitoring/alerting enhancement
        - Security training/documentation
        - Compliance/audit improvement
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: ⚡ Priority Level
      description: How important is this enhancement?
      options:
        - High (Addresses significant security gaps)
        - Medium (Good security improvement)
        - Low (Nice to have enhancement)
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: 📊 Current Security State
      description: Describe the current security implementation or lack thereof
      placeholder: Explain what security measures currently exist in this area...
    validations:
      required: true

  - type: textarea
    id: proposed-enhancement
    attributes:
      label: 💡 Proposed Enhancement
      description: Describe your suggested security enhancement in detail
      placeholder: Explain what you propose to implement or improve...
    validations:
      required: true

  - type: textarea
    id: security-benefits
    attributes:
      label: 🛡️ Security Benefits
      description: What security benefits would this enhancement provide?
      placeholder: Describe how this enhancement would improve our security posture...
    validations:
      required: true

  - type: textarea
    id: implementation-approach
    attributes:
      label: 🔨 Implementation Approach
      description: How do you suggest implementing this enhancement?
      placeholder: Describe the technical approach, tools, or processes needed...

  - type: textarea
    id: potential-risks
    attributes:
      label: ⚠️ Potential Risks/Considerations
      description: Are there any risks or considerations with this enhancement?
      placeholder: Describe any potential downsides, compatibility issues, or other considerations...

  - type: textarea
    id: success-metrics
    attributes:
      label: 📈 Success Metrics
      description: How would we measure the success of this enhancement?
      placeholder: Describe how we could measure the effectiveness of this security improvement...

  - type: textarea
    id: additional-context
    attributes:
      label: ℹ️ Additional Context
      description: Any additional information, references, or context
      placeholder: Links to security standards, best practices, tools, etc...

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Enhancement Checklist
      description: Please confirm the following
      options:
        - label: I have researched existing security measures in this area
          required: true
        - label: I have considered the implementation complexity
          required: true
        - label: I have thought about potential security risks of this change
          required: true
        - label: I understand this will be reviewed by the security team
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 🔄 Review Process
        
        1. **Initial Review:** Security team will review within 5 business days
        2. **Assessment:** We'll assess feasibility and security impact
        3. **Planning:** If approved, we'll plan implementation timeline
        4. **Implementation:** Development and testing of the enhancement
        5. **Validation:** Security validation and verification
        
        ## 🏆 Recognition
        
        We value security-minded contributions! Contributors to security enhancements may receive:
        - Recognition in our security hall of fame
        - Security achievement badges
        - Potential rewards for exceptional contributions
        
        Thank you for helping improve our security! 🙏