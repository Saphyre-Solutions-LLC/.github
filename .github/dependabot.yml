# 🔒 Dependabot Security Configuration for Saphyre Solutions LLC
# This configuration enables automatic security updates across all supported ecosystems

version: 2
updates:
  # 📦 npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Saphyre-Solutions-LLC/security-team"
    assignees:
      - "Saphyre-Solutions-LLC/security-team"
    commit-message:
      prefix: "🔒 security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "automated"
    allow:
      # Only security updates for production dependencies
      - dependency-type: "direct:production"
        update-type: "security"
      - dependency-type: "indirect"
        update-type: "security"

