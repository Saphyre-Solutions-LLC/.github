name: 🔄 Dependency Updates

on:
  schedule:
    # Check for dependency updates daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-updates:
    name: 🔄 Check Dependency Updates
    runs-on: ubuntu-latest
    if: github.repository != 'Saphyre-Solutions-LLC/.github'
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🔍 Check for outdated dependencies
      id: outdated
      run: |
        # Check for package.json
        if [ -f "package.json" ]; then
          echo "📦 Checking npm dependencies..."
          npx npm-check-updates --target minor > outdated-npm.txt 2>&1 || true
          echo "npm=true" >> $GITHUB_OUTPUT
        fi
        
        # Check for requirements.txt
        if [ -f "requirements.txt" ]; then
          echo "🐍 Checking Python dependencies..."
          pip install pip-check 2>/dev/null || true
          pip-check > outdated-python.txt 2>&1 || true
          echo "python=true" >> $GITHUB_OUTPUT
        fi
        
        # Check for pom.xml
        if [ -f "pom.xml" ]; then
          echo "☕ Checking Maven dependencies..."
          mvn versions:display-dependency-updates > outdated-maven.txt 2>&1 || true
          echo "maven=true" >> $GITHUB_OUTPUT
        fi
        
        # Check for composer.json
        if [ -f "composer.json" ]; then
          echo "🐘 Checking Composer dependencies..."
          composer outdated > outdated-composer.txt 2>&1 || true
          echo "composer=true" >> $GITHUB_OUTPUT
        fi
    
    - name: 📧 Create issue for outdated dependencies
      if: steps.outdated.outputs.npm == 'true' || steps.outdated.outputs.python == 'true' || steps.outdated.outputs.maven == 'true' || steps.outdated.outputs.composer == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body = '## 🔄 Outdated Dependencies Report\n\n';
          body += '**Security Notice:** Please review and update these dependencies to address potential security vulnerabilities.\n\n';
          
          // Check each dependency file
          const files = ['outdated-npm.txt', 'outdated-python.txt', 'outdated-maven.txt', 'outdated-composer.txt'];
          const labels = ['📦 npm', '🐍 Python', '☕ Maven', '🐘 Composer'];
          
          for (let i = 0; i < files.length; i++) {
            if (fs.existsSync(files[i])) {
              const content = fs.readFileSync(files[i], 'utf8');
              if (content.trim()) {
                body += `### ${labels[i]} Dependencies\n\`\`\`\n${content}\n\`\`\`\n\n`;
              }
            }
          }
          
          body += '---\n\n';
          body += '**⚠️ Action Required:**\n';
          body += '1. Review the outdated dependencies above\n';
          body += '2. Check for security vulnerabilities in the listed packages\n';
          body += '3. Update dependencies following our security guidelines\n';
          body += '4. Test thoroughly after updates\n\n';
          body += '**🔗 Useful Resources:**\n';
          body += '- [Security Policy](./SECURITY.md)\n';
          body += '- [Contributing Guidelines](./contributing.md)\n\n';
          body += '> This issue was automatically generated by our security monitoring system.';
          
          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'security,dependencies',
            state: 'open'
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Security: Outdated Dependencies Detected',
              body: body,
              labels: ['security', 'dependencies', 'automated']
            });
          }

  security-advisory-check:
    name: 🚨 Security Advisory Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🔍 Check for security advisories
      uses: actions/github-script@v7
      with:
        script: |
          // Check for security advisories affecting this repository
          try {
            const advisories = await github.rest.repos.listSecurityAdvisories({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'published'
            });
            
            if (advisories.data.length > 0) {
              console.log(`🚨 Found ${advisories.data.length} security advisories`);
              
              let body = '## 🚨 Security Advisories Alert\n\n';
              body += 'The following security advisories affect this repository:\n\n';
              
              for (const advisory of advisories.data) {
                body += `### ${advisory.summary}\n`;
                body += `- **Severity:** ${advisory.severity}\n`;
                body += `- **Published:** ${advisory.published_at}\n`;
                body += `- **Description:** ${advisory.description}\n\n`;
              }
              
              body += '**⚠️ Immediate Action Required:**\n';
              body += '1. Review each advisory carefully\n';
              body += '2. Apply recommended fixes immediately\n';
              body += '3. Update affected dependencies\n';
              body += '4. Verify fixes with security team\n\n';
              body += '> This alert was automatically generated by our security monitoring system.';
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 URGENT: Security Advisories Require Attention',
                body: body,
                labels: ['security', 'urgent', 'advisory']
              });
            }
          } catch (error) {
            console.log('No security advisories found or error checking:', error.message);
          }