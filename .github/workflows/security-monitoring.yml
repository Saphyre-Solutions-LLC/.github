name: 🔒 Security Monitoring & Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔍 Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  dependency-security:
    name: 🔗 Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 GitHub Security Advisory Check
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          
  license-compliance:
    name: 📄 License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 License Compliance Scan
        uses: fossas/fossa-action@main
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
        continue-on-error: true

  ai-security-scan:
    name: 🤖 AI Security Assessment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Scan for AI Training Data Exposure
        run: |
          echo "🔍 Scanning for potential AI training data exposure..."
          
          # Check for common AI training data patterns
          echo "Checking for potential training data files..."
          find . -type f \( -name "*.csv" -o -name "*.json" -o -name "*.txt" -o -name "*.jsonl" \) -size +10M | while read file; do
            echo "⚠️  Large data file found: $file ($(du -h "$file" | cut -f1))"
          done
          
          # Check for API keys and model endpoints
          echo "Checking for AI service configurations..."
          grep -r -i "openai\|anthropic\|azure.*cognitive\|huggingface" . --include="*.py" --include="*.js" --include="*.json" --include="*.yaml" --include="*.yml" || true
          
          # Check for prompt injection patterns
          echo "Checking for potential prompt injection vulnerabilities..."
          grep -r -i "prompt\|inject\|system.*message" . --include="*.py" --include="*.js" || true

      - name: 🔍 Model Endpoint Security Check
        run: |
          echo "🔍 Checking AI model endpoint configurations..."
          
          # Look for hardcoded API endpoints
          grep -r -E "https?://.*\.(openai|anthropic|azure|huggingface)\." . --include="*.py" --include="*.js" --include="*.json" || true
          
          # Check for authentication patterns
          grep -r -i "api.*key\|bearer.*token\|auth.*header" . --include="*.py" --include="*.js" || true

  security-policy-validation:
    name: 📋 Security Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Validate Security Documentation
        run: |
          echo "🔍 Validating security documentation presence..."
          
          # Check for required security files
          required_files=(
            ".github/SECURITY.md"
            "CODE_OF_CONDUCT.md"
            "contributing.md"
          )
          
          missing_files=()
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing_files+=("$file")
            fi
          done
          
          if [[ ${#missing_files[@]} -gt 0 ]]; then
            echo "❌ Missing required security files:"
            printf '%s\n' "${missing_files[@]}"
            exit 1
          else
            echo "✅ All required security files present"
          fi

      - name: 🔍 Check Branch Protection Readiness
        run: |
          echo "🔍 Checking repository structure for branch protection..."
          
          # Verify main branch exists
          if git show-ref --verify --quiet refs/heads/main; then
            echo "✅ Main branch exists"
          else
            echo "⚠️  Main branch not found - branch protection may not be configured"
          fi
          
          # Check for workflow files that should be protected
          if [[ -d ".github/workflows" ]]; then
            echo "✅ Workflow directory exists"
            workflow_count=$(find .github/workflows -name "*.yml" -o -name "*.yaml" | wc -l)
            echo "📊 Found $workflow_count workflow files"
          fi

  security-baseline-check:
    name: 🏛️ Security Baseline Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Git Security Configuration Check
        run: |
          echo "🔍 Checking Git security configurations..."
          
          # Check for signed commits preference
          if git log --show-signature -1 >/dev/null 2>&1; then
            echo "✅ Recent commits are signed"
          else
            echo "⚠️  Consider enabling commit signing for enhanced security"
          fi
          
          # Check for sensitive files in git history
          echo "🔍 Scanning for potentially sensitive files in history..."
          git log --name-only --pretty=format: | sort -u | grep -E "\.(key|pem|p12|pfx|env|secret)$" || echo "✅ No obvious sensitive files found in history"

      - name: 🔍 File Permission Check
        run: |
          echo "🔍 Checking file permissions..."
          
          # Find files with potentially dangerous permissions
          find . -type f \( -perm -4000 -o -perm -2000 \) -ls || echo "✅ No setuid/setgid files found"
          
          # Check for world-writable files
          find . -type f -perm -002 -ls || echo "✅ No world-writable files found"

  notification:
    name: 📧 Security Notification
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-security, ai-security-scan, security-policy-validation]
    if: failure()
    steps:
      - name: 📧 Notify Security Team
        run: |
          echo "🚨 Security scan failures detected!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          
          # In a real environment, this would send notifications to:
          # - Security team email
          # - Slack channel
          # - Incident management system
          
          echo "⚠️  Please review the failed security checks and remediate issues promptly."