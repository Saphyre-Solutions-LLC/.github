# 🔒 Organization Security Configuration
# This file defines default security settings that will be applied to all repositories
# in the Saphyre Solutions LLC organization

# Repository Security Defaults
repository:
  # Security Features - ALL ENABLED by default
  security_features:
    vulnerability_alerts: true
    automated_security_fixes: true
    dependency_graph: true
    secret_scanning: true
    secret_scanning_push_protection: true
    
  # Default visibility for new repositories
  default_visibility: private
  
  # Delete head branches after PR merge
  delete_branch_on_merge: true
  
  # Require signed commits
  require_signed_commits: false  # Will be enabled organization-wide later

# Branch Protection Defaults
branch_protection:
  # Apply to these branches by default
  protected_branches:
    - main
    - master
    - develop
    - release/*
    - hotfix/*
  
  # Protection rules
  rules:
    # Require pull request reviews
    required_pull_request_reviews:
      required_approving_review_count: 2
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: true
      restrict_pushes_that_create_files: false
    
    # Required status checks
    required_status_checks:
      strict: true
      contexts:
        - "Security Scanning"
        - "Dependency Review"
        - "CodeQL Analysis"
        - "Secret Scanning"
    
    # Additional protections
    enforce_admins: true
    required_linear_history: true
    allow_force_pushes: false
    allow_deletions: false
    block_creations: false
    required_conversation_resolution: true

# Dependabot Configuration Defaults
dependabot:
  # Update schedule
  schedule:
    interval: daily
    time: "06:00"
    timezone: "UTC"
  
  # Default reviewers and assignees
  reviewers:
    - "Saphyre-Solutions-LLC/security-team"
  assignees:
    - "Saphyre-Solutions-LLC/security-team"
  
  # Default labels
  labels:
    - "security"
    - "dependencies"
    - "automated"
  
  # Limits
  open_pull_requests_limit: 10
  
  # Only security updates by default
  allow:
    - dependency-type: "direct:production"
      update-type: "security"
    - dependency-type: "indirect"
      update-type: "security"

# GitHub Actions Security Defaults
actions:
  # Default permissions for GITHUB_TOKEN
  default_permissions:
    contents: read
    issues: write
    pull-requests: write
    security-events: write
    actions: read
  
  # Workflow restrictions
  allowed_actions: "selected"
  allowed_actions_config:
    github_owned_allowed: true
    verified_allowed: true
    patterns_allowed:
      - "actions/*"
      - "github/*"
      - "microsoft/*"
      - "returntocorp/semgrep-action@*"
      - "trufflesecurity/trufflehog@*"

# Security Scanning Defaults
security_scanning:
  # CodeQL configuration
  codeql:
    languages: ["javascript", "python", "java", "csharp", "cpp", "go", "ruby"]
    queries: "security-extended,security-and-quality"
    schedule: "daily"
  
  # Secret scanning
  secret_scanning:
    enabled: true
    push_protection: true
    
  # Dependency scanning
  dependency_scanning:
    enabled: true
    schedule: "daily"

# Issue and PR Templates
templates:
  # Default issue labels
  default_issue_labels:
    - "needs-triage"
    
  # Security-related labels
  security_labels:
    - "security"
    - "vulnerability"
    - "urgent"
    - "critical"
    - "enhancement"
    - "compliance"
  
  # Required templates
  required_templates:
    - "security-vulnerability.yml"
    - "security-enhancement.yml"
    - "pull_request_template.md"

# Team Access and Permissions
team_permissions:
  # Security team access
  security_team:
    permission: "admin"
    repositories: "all"
  
  # Default team permissions
  default_teams:
    developers:
      permission: "write"
    reviewers:
      permission: "write"
    guests:
      permission: "read"

# Organization Security Policies
policies:
  # Require 2FA for all organization members
  require_2fa: true
  
  # Require SSO for repository access
  require_sso: true
  
  # Default member privileges
  default_member_repository_permission: "read"
  
  # External collaborator restrictions
  members_can_create_repositories: false
  members_can_create_public_repositories: false
  members_can_create_private_repositories: false
  members_can_create_internal_repositories: false
  
  # Pages restrictions
  members_can_create_pages: false
  members_can_create_public_pages: false
  members_can_create_private_pages: true

# Compliance and Auditing
compliance:
  # Audit requirements
  audit_schedule: "quarterly"
  
  # Required documentation
  required_docs:
    - "SECURITY.md"
    - "SECURITY-GUIDELINES.md"
    - "CODE_OF_CONDUCT.md"
    - "contributing.md"
  
  # Security review requirements
  security_review_required_for:
    - "infrastructure changes"
    - "authentication changes"
    - "permission changes"
    - "external integrations"
    - "data handling changes"

# Monitoring and Alerting
monitoring:
  # Alert channels
  alert_channels:
    critical: "security@SaphyreSolutions.com"
    high: "security@SaphyreSolutions.com"
    medium: "security@SaphyreSolutions.com"
    low: "security@SaphyreSolutions.com"
  
  # Response time SLAs
  response_times:
    critical: "1 hour"
    high: "4 hours"
    medium: "24 hours"
    low: "72 hours"
  
  # Automated monitoring
  automated_checks:
    - "dependency vulnerabilities"
    - "secret exposure"
    - "security configuration drift"
    - "access permission changes"
    - "failed authentication attempts"

# Emergency Procedures
emergency:
  # Emergency contacts
  contacts:
    primary: "Tim.Spurlin@SaphyreSolutions.com"
    security_team: "security@SaphyreSolutions.com"
    backup: "support@SaphyreSolutions.com"
  
  # Emergency response procedures
  procedures:
    security_incident: "Follow incident response playbook"
    data_breach: "Immediate containment and notification"
    system_compromise: "Isolate affected systems"
    credential_exposure: "Immediate credential rotation"

# Documentation and Training
documentation:
  # Required security training
  required_training:
    - "Security Awareness Fundamentals"
    - "Secure Coding Practices"
    - "GitHub Security Features"
    - "Incident Response Procedures"
  
  # Training schedule
  training_schedule:
    new_members: "Within first week"
    refresher: "Quarterly"
    specialized: "As needed"
  
  # Documentation updates
  doc_review_schedule: "Quarterly"
  doc_owner: "security-team"

---
# Configuration Metadata
metadata:
  version: "1.0"
  created_date: "2024-01-01"
  last_updated: "2024-01-01"
  owner: "Saphyre Solutions LLC Security Team"
  contact: "security@SaphyreSolutions.com"
  
# Notes
notes: |
  This configuration file defines organization-wide security defaults.
  Individual repositories may have additional security requirements
  but cannot have less restrictive settings than defined here.
  
  For questions or changes to this configuration, contact:
  security@SaphyreSolutions.com